<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}할 일{% endblock %}</title>
  <style>
    :root {
      --bg: #f3f5ee; --card: #ffffff; --text: #22261f; --muted: #6c7364;
      --line: #dde1d2; --accent: #2f6f62; --accent-tint: #e3f0eb; --accent-text: #1f5347;
      --danger: #b23a3a; --done: #7f9678;
      --high: #c15b3d; --high-tint: #f7e7e0;
      --low: #5b8a72; --low-tint: #e6efe7;
      --warn-bg: #fbeae7; --warn-text: #7a2a1e; --warn-line: #e3b3a6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b16; --card: #1e2420; --text: #e8ece2; --muted: #93998a;
        --line: #333a30; --accent: #6fbfa9; --accent-tint: #1f3530; --accent-text: #9fe0cb;
        --danger: #e28080; --done: #8fa089;
        --high: #e08a66; --high-tint: #3a2620;
        --low: #8fc29c; --low-tint: #223a28;
        --warn-bg: #3a2420; --warn-text: #f3c7bc; --warn-line: #7a3a2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .wrap { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(20, 25, 15, 0.05);
    }
    .card.today-done { background: var(--low-tint); border-color: var(--low); }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input, select, button {
      font: inherit; color: inherit; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.link {
      background: none; border: none; padding: 2px 6px;
      color: var(--muted); font-size: 13px; text-decoration: underline;
    }
    button.link.danger { color: var(--danger); }
    .grid { display: grid; grid-template-columns: 1fr 160px; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 10px; margin-top: 10px; }
    @media (max-width: 560px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
    .flash {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px;
      background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line);
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
    .tab {
      padding: 5px 11px; border-radius: 999px; font-size: 13px; text-decoration: none;
      color: var(--muted); border: 1px solid var(--line);
    }
    .tab.on { background: var(--accent); color: #fff; border-color: transparent; }
    ul.todos { list-style: none; margin: 0; padding: 0; }
    ul.todos li {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 0 12px 10px; border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent;
    }
    ul.todos li:last-child { border-bottom: none; }
    ul.todos li.priority-1 { border-left-color: var(--high); }
    ul.todos li.priority-3 { border-left-color: var(--low); }
    .toggle {
      font-size: 17px; line-height: 1; width: 24px; text-align: center;
      color: var(--muted); border-color: transparent; background: none; padding: 3px 0;
    }
    .done .toggle { color: var(--low); }
    .body { flex: 1; min-width: 0; }
    .title { font-weight: 500; word-break: break-word; }
    .done .title { text-decoration: line-through; color: var(--done); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .overdue { color: var(--danger); font-weight: 500; }
    .chip {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; background: var(--accent-tint); color: var(--accent-text); margin-right: 4px;
    }
    .empty { color: var(--muted); text-align: center; padding: 28px 0; }
    footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
