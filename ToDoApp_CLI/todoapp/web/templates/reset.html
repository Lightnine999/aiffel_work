{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}

{% block content %}
<h1>비밀번호 찾기</h1>
<p class="sub">가입하신 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>

<div class="card">
  <form method="post" action="{{ url_for('.reset') }}">
    <p>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required autofocus
             value="{{ email or '' }}" style="width:100%">
    </p>
    <p style="margin:16px 0 0">
      <button class="primary" type="submit">재설정 링크 받기</button>
      <a class="tab" href="{{ url_for('.login') }}" style="margin-left:8px">로그인으로</a>
    </p>
  </form>
</div>

<footer>메일이 안 오면 스팸함을 확인하세요. 무료 플랜은 시간당 발송 수에 제한이 있습니다.</footer>
{% endblock %}
